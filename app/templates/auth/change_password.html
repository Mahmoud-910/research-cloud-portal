{% extends "base.html" %}{% block title %}Change Password{% endblock %}
{% block content %}
<div class="portal-page d-flex align-items-center justify-content-center" style="min-height:calc(100vh - 56px)">
  <div class="portal-card" style="width:420px;max-width:95vw;">
    <div class="portal-card-header"><i class="fas fa-key me-2"></i>Change Password</div>
    <div class="portal-card-body">
      <p style="font-size:13px;color:var(--text-3);margin-bottom:20px;">
        Your password must be at least 12 characters with uppercase, lowercase, digit, and special character.
      </p>
      <form method="POST" action="{{ url_for('auth.change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-3">
          <label class="portal-label">Current Password</label>
          <input type="password" name="current_password" class="form-control portal-input" required/>
        </div>
        <div class="mb-3">
          <label class="portal-label">New Password</label>
          <input type="password" name="new_password" id="new_pw" class="form-control portal-input" required/>
        </div>
        <div class="mb-4">
          <label class="portal-label">Confirm New Password</label>
          <input type="password" name="confirm_password" class="form-control portal-input" required/>
        </div>
        <button type="submit" class="btn btn-launch w-100 py-2">
          <i class="fas fa-check me-2"></i>Change Password
        </button>
      </form>
    </div>
  </div>
</div>{% endblock %}
